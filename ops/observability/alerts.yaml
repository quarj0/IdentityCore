      / clamp_min(sum(rate(identitycore_operations_total{component="provider",environment="production"}[6h])),
      1e-9)) / 0.010000
  - alert: IdentityCoreProviderBudgetBurnCritical
    expr: identitycore:slo_provider:burn_5m > 14.4 and identitycore:slo_provider:burn_1h
      > 14.4
    for: 2m
    labels:
      severity: critical
      environment: production
      service: identitycore
      sli: provider
    annotations:
      summary: provider error budget burning too quickly
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/slo-alerts.md#provider
  - alert: IdentityCoreProviderBudgetBurnWarning
    expr: identitycore:slo_provider:burn_30m > 6 and identitycore:slo_provider:burn_6h
      > 6
    for: 15m
    labels:
      severity: warning
      environment: production
      service: identitycore
      sli: provider
    annotations:
      summary: provider error budget burning too quickly
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/slo-alerts.md#provider
  - record: identitycore:slo_webhook:burn_5m
    expr: (sum(rate(identitycore_operations_total{component="webhook",environment="production",outcome="error"}[5m]))
      / clamp_min(sum(rate(identitycore_operations_total{component="webhook",environment="production"}[5m])),
      1e-9)) / 0.010000
  - record: identitycore:slo_webhook:burn_30m
    expr: (sum(rate(identitycore_operations_total{component="webhook",environment="production",outcome="error"}[30m]))
      / clamp_min(sum(rate(identitycore_operations_total{component="webhook",environment="production"}[30m])),
      1e-9)) / 0.010000
  - record: identitycore:slo_webhook:burn_1h
    expr: (sum(rate(identitycore_operations_total{component="webhook",environment="production",outcome="error"}[1h]))
      / clamp_min(sum(rate(identitycore_operations_total{component="webhook",environment="production"}[1h])),
      1e-9)) / 0.010000
  - record: identitycore:slo_webhook:burn_6h
    expr: (sum(rate(identitycore_operations_total{component="webhook",environment="production",outcome="error"}[6h]))
      / clamp_min(sum(rate(identitycore_operations_total{component="webhook",environment="production"}[6h])),
      1e-9)) / 0.010000
  - alert: IdentityCoreWebhookBudgetBurnCritical
    expr: identitycore:slo_webhook:burn_5m > 14.4 and identitycore:slo_webhook:burn_1h
      > 14.4
    for: 2m
    labels:
      severity: critical
      environment: production
      service: identitycore
      sli: webhook
    annotations:
      summary: webhook error budget burning too quickly
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/slo-alerts.md#webhook
  - alert: IdentityCoreWebhookBudgetBurnWarning
    expr: identitycore:slo_webhook:burn_30m > 6 and identitycore:slo_webhook:burn_6h
      > 6
    for: 15m
    labels:
      severity: warning
      environment: production
      service: identitycore
      sli: webhook
    annotations:
      summary: webhook error budget burning too quickly
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/slo-alerts.md#webhook
  - record: identitycore:slo_storage:burn_5m
    expr: (sum(rate(identitycore_operations_total{component="storage",environment="production",outcome="error"}[5m]))
      / clamp_min(sum(rate(identitycore_operations_total{component="storage",environment="production"}[5m])),
      1e-9)) / 0.001000
  - record: identitycore:slo_storage:burn_30m
    expr: (sum(rate(identitycore_operations_total{component="storage",environment="production",outcome="error"}[30m]))
      / clamp_min(sum(rate(identitycore_operations_total{component="storage",environment="production"}[30m])),
      1e-9)) / 0.001000
  - record: identitycore:slo_storage:burn_1h
    expr: (sum(rate(identitycore_operations_total{component="storage",environment="production",outcome="error"}[1h]))
      / clamp_min(sum(rate(identitycore_operations_total{component="storage",environment="production"}[1h])),
      1e-9)) / 0.001000
  - record: identitycore:slo_storage:burn_6h
    expr: (sum(rate(identitycore_operations_total{component="storage",environment="production",outcome="error"}[6h]))
      / clamp_min(sum(rate(identitycore_operations_total{component="storage",environment="production"}[6h])),
      1e-9)) / 0.001000
  - alert: IdentityCoreStorageBudgetBurnCritical
    expr: identitycore:slo_storage:burn_5m > 14.4 and identitycore:slo_storage:burn_1h
      > 14.4
    for: 2m
    labels:
      severity: critical
      environment: production
      service: identitycore
      sli: storage
    annotations:
      summary: storage error budget burning too quickly
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/slo-alerts.md#storage
  - alert: IdentityCoreStorageBudgetBurnWarning
    expr: identitycore:slo_storage:burn_30m > 6 and identitycore:slo_storage:burn_6h
      > 6
    for: 15m
    labels:
      severity: warning
      environment: production
      service: identitycore
      sli: storage
    annotations:
      summary: storage error budget burning too quickly
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/slo-alerts.md#storage
  - alert: IdentityCoreQueueStalled
    expr: max by (queue, environment) (identitycore_backlog_oldest_seconds{environment="production"})
      > 300
    for: 2m
    labels:
      severity: critical
      service: identitycore
    annotations:
      summary: Production durable work is older than five minutes
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/processing-job-recovery.md
  - alert: IdentityCoreMonitoringMissing
    expr: absent(identitycore_backlog_heartbeat_seconds) or time() - max(identitycore_backlog_heartbeat_seconds)
      > 60
    for: 2m
    labels:
      severity: critical
      environment: production
      service: identitycore
    annotations:
      summary: Independent operations exporter is missing or stale
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/slo-alerts.md#monitoring
  - alert: IdentityCoreProcessingLatency
    expr: (sum(rate(identitycore_processing_duration_seconds_bucket{environment="production",le="120"}[1h]))
      / clamp_min(sum(rate(identitycore_processing_duration_seconds_count{environment="production"}[1h])),
      1e-9)) < 0.95 and sum(increase(identitycore_processing_duration_seconds_count{environment="production"}[1h]))
      > 20
    for: 15m
    labels:
      severity: warning
      environment: production
      service: identitycore
    annotations:
      summary: Less than 95% of production processing finishes within two minutes
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/slo-alerts.md#processing
  - alert: IdentityCoreBackupFailed
    expr: time() - max(identitycore_backup_failure_timestamp_seconds{environment="production"})
      < 600
    labels:
      severity: critical
      environment: production
      service: identitycore
    annotations:
      summary: Encrypted backup or archive publication failed
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/backup-restore.md
  - alert: IdentityCoreBackupStale
    expr: time() - max(max_over_time(identitycore_backup_last_success_seconds{environment="production"}[24h]))
      > 64800 or absent_over_time(identitycore_backup_last_success_seconds{environment="production"}[24h])
    for: 5m
    labels:
      severity: critical
      environment: production
      service: identitycore
    annotations:
      summary: Last successful encrypted archive is missing or older than 18 hours
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/backup-restore.md
