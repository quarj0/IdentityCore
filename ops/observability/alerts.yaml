groups:
- name: identitycore-slos
  rules:
  - record: identitycore:slo_api:burn_5m
    expr: (sum(rate(identitycore_responses_total{component="api",environment="production",outcome="error"}[5m]))
      / clamp_min(sum(rate(identitycore_responses_total{component="api",environment="production"}[5m])),
      1e-9)) / 0.001000
  - record: identitycore:slo_api:burn_30m
    expr: (sum(rate(identitycore_responses_total{component="api",environment="production",outcome="error"}[30m]))
      / clamp_min(sum(rate(identitycore_responses_total{component="api",environment="production"}[30m])),
      1e-9)) / 0.001000
  - record: identitycore:slo_api:burn_1h
    expr: (sum(rate(identitycore_responses_total{component="api",environment="production",outcome="error"}[1h]))
      / clamp_min(sum(rate(identitycore_responses_total{component="api",environment="production"}[1h])),
      1e-9)) / 0.001000
  - record: identitycore:slo_api:burn_6h
    expr: (sum(rate(identitycore_responses_total{component="api",environment="production",outcome="error"}[6h]))
      / clamp_min(sum(rate(identitycore_responses_total{component="api",environment="production"}[6h])),
      1e-9)) / 0.001000
  - alert: IdentityCoreApiBudgetBurnCritical
    expr: identitycore:slo_api:burn_5m > 14.4 and identitycore:slo_api:burn_1h > 14.4
    for: 2m
    labels:
      severity: critical
      environment: production
      service: identitycore
      sli: api
    annotations:
      summary: api error budget burning too quickly
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/slo-alerts.md#api
  - alert: IdentityCoreApiBudgetBurnWarning
    expr: identitycore:slo_api:burn_30m > 6 and identitycore:slo_api:burn_6h > 6
    for: 15m
    labels:
      severity: warning
      environment: production
      service: identitycore
      sli: api
    annotations:
      summary: api error budget burning too quickly
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/slo-alerts.md#api
  - record: identitycore:slo_processing:burn_5m
    expr: (sum(rate(identitycore_processing_completed_total{environment="production",outcome="error"}[5m]))
      / clamp_min(sum(rate(identitycore_processing_completed_total{environment="production"}[5m])),
      1e-9)) / 0.010000
  - record: identitycore:slo_processing:burn_30m
    expr: (sum(rate(identitycore_processing_completed_total{environment="production",outcome="error"}[30m]))
      / clamp_min(sum(rate(identitycore_processing_completed_total{environment="production"}[30m])),
      1e-9)) / 0.010000
  - record: identitycore:slo_processing:burn_1h
    expr: (sum(rate(identitycore_processing_completed_total{environment="production",outcome="error"}[1h]))
      / clamp_min(sum(rate(identitycore_processing_completed_total{environment="production"}[1h])),
      1e-9)) / 0.010000
  - record: identitycore:slo_processing:burn_6h
    expr: (sum(rate(identitycore_processing_completed_total{environment="production",outcome="error"}[6h]))
      / clamp_min(sum(rate(identitycore_processing_completed_total{environment="production"}[6h])),
      1e-9)) / 0.010000
  - alert: IdentityCoreProcessingBudgetBurnCritical
    expr: identitycore:slo_processing:burn_5m > 14.4 and identitycore:slo_processing:burn_1h
      > 14.4
    for: 2m
    labels:
      severity: critical
      environment: production
      service: identitycore
      sli: processing
    annotations:
      summary: processing error budget burning too quickly
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/slo-alerts.md#processing
  - alert: IdentityCoreProcessingBudgetBurnWarning
    expr: identitycore:slo_processing:burn_30m > 6 and identitycore:slo_processing:burn_6h
      > 6
    for: 15m
    labels:
      severity: warning
      environment: production
      service: identitycore
      sli: processing
    annotations:
      summary: processing error budget burning too quickly
      runbook_url: https://github.com/quarj0/IdentityCore/blob/main/docs/operations/slo-alerts.md#processing
  - record: identitycore:slo_provider:burn_5m
    expr: (sum(rate(identitycore_operations_total{component="provider",environment="production",outcome="error"}[5m]))
      / clamp_min(sum(rate(identitycore_operations_total{component="provider",environment="production"}[5m])),
      1e-9)) / 0.010000
  - record: identitycore:slo_provider:burn_30m
    expr: (sum(rate(identitycore_operations_total{component="provider",environment="production",outcome="error"}[30m]))
      / clamp_min(sum(rate(identitycore_operations_total{component="provider",environment="production"}[30m])),
      1e-9)) / 0.010000
  - record: identitycore:slo_provider:burn_1h
    expr: (sum(rate(identitycore_operations_total{component="provider",environment="production",outcome="error"}[1h]))
      / clamp_min(sum(rate(identitycore_operations_total{component="provider",environment="production"}[1h])),
