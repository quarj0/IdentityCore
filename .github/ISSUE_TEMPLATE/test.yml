name: Test coverage or tooling
description: Improve automated coverage, fixtures, test tooling or reliability.
title: "[Test coverage or tooling]: "
labels: ["type:test", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        For any possible or confirmed vulnerability, [report privately](https://github.com/quarj0/IdentityCore/security/advisories/new). Do not disclose vulnerability details in this public form. Use synthetic data and remove credentials and personal information.
  - type: input
    id: backlog
    attributes:
      label: Backlog ID
      description: Include the stable IC-### ID when applicable.
      placeholder: IC-###
  - type: textarea
    id: outcome
    attributes:
      label: Problem and intended outcome
      description: Explain the affected users or maintainers and the independently deliverable improvement.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and affected components
      description: Identify the code, tests or documents to change and relevant boundaries.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: Provide observable completion criteria and meaningful positive and negative validation.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and rollout
      description: List prerequisite IDs, compatibility constraints, migrations and rollout or rollback needs.
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: Security, privacy and tenant-isolation considerations
      description: Describe safe boundaries without disclosing a suspected vulnerability.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing issue and removed sensitive data.
          required: true
        - label: This public proposal does not report a possible or confirmed vulnerability.
          required: true
