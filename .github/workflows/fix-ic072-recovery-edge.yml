name: Fix IC-072 recovery evidence edge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ic072-postmerge-ownership
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --group django --group dev --frozen
      - name: Require reusable committed evidence for every biometric stage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/django/apps/verifications/processing_jobs.py')
          text = path.read_text()
          start = text.index('def _repair_biometric_provider_check_links(resource) -> bool:\n')
          end = text.index('def _route_exhaustion_resource_reference(\n', start)
          replacement = '''def _repair_biometric_provider_check_links(resource) -> bool:
              """Relink committed evidence and require every biometric stage to be reusable."""
              from apps.biometrics.models import FaceMatchStatus, LivenessCheckStatus
              from apps.providers.models import ProviderCheckStatus, ProviderCheckType

              verification = resource.verification

              def latest_completed(check_type: str, metadata_key: str, resource_id: str):
                  candidates = verification.provider_checks.filter(
                      check_type=check_type,
                      status=ProviderCheckStatus.COMPLETED,
                  ).order_by("-completed_at", "-created_at")
                  return next(
                      (
                          check
                          for check in candidates
                          if check.normalized_result_json
                          and (check.request_metadata_json or {}).get(metadata_key) == resource_id
                      ),
                      None,
                  )

              current = verification.provider_checks.filter(
                  public_id=resource.provider_check_id
              ).first()
              liveness_reusable = _provider_check_is_reusable(current)
              if (
                  resource.status == LivenessCheckStatus.INCONCLUSIVE
                  and not liveness_reusable
              ):
                  recovered = latest_completed(
                      ProviderCheckType.LIVENESS,
                      "liveness_check_id",
                      resource.public_id,
                  )
                  if recovered is not None:
                      resource.provider_check_id = recovered.public_id
                      resource.save(update_fields=["provider_check_id", "updated_at"])
                      liveness_reusable = True

              face_match = (
                  verification.face_matches.filter(selfie_capture=resource.selfie_capture)
                  .order_by("-matched_at", "-created_at")
                  .first()
              )
              if face_match is None:
                  return liveness_reusable

              current = verification.provider_checks.filter(
                  public_id=face_match.provider_check_id
              ).first()
              face_reusable = _provider_check_is_reusable(current)
              if (
                  face_match.status == FaceMatchStatus.INCONCLUSIVE
                  and not face_reusable
              ):
                  recovered = latest_completed(
                      ProviderCheckType.FACE_MATCH,
                      "face_match_id",
                      face_match.public_id,
                  )
                  if recovered is not None:
                      face_match.provider_check_id = recovered.public_id
                      face_match.save(update_fields=["provider_check_id", "updated_at"])
                      face_reusable = True

              return liveness_reusable and face_reusable


          '''
          # Dedent the embedded function body to module scope.
          import textwrap
          replacement = textwrap.dedent(replacement)
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - run: uv run --project backend black backend/django/apps/verifications/processing_jobs.py
      - run: uv run --project backend ruff check backend/django/apps/verifications/processing_jobs.py
      - name: Run recovery regression and full backend suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
        run: |
          uv run --project backend python backend/django/manage.py test apps.verifications.test_processing_job_evidence_preservation apps.biometrics.test_finalization_recovery apps.verifications.test_processing_job_review_races --verbosity 1
          uv run --project backend python backend/django/manage.py test apps common config --verbosity 1
      - run: git diff --check
      - name: Commit source-only correction
        run: |
          git rm .github/workflows/fix-ic072-recovery-edge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/django/apps/verifications/processing_jobs.py
          git commit -m "Require reusable evidence for biometric recovery"
          git push origin HEAD:fix/ic072-postmerge-ownership
