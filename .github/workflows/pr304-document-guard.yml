name: PR304 document failure ownership guard

on:
  push:
    branches:
      - fix/ic072-postmerge-ownership
    paths:
      - tools/apply_pr304_document_failure_guard.py
      - .github/workflows/pr304-document-guard.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ic072-postmerge-ownership
          fetch-depth: 0
      - name: Apply document failure ownership guard
        run: python tools/apply_pr304_document_failure_guard.py
      - name: Verify patch hygiene
        run: |
          python -m py_compile backend/django/apps/identity_documents/tasks.py
          git diff --check
      - name: Remove one-shot machinery and commit
        run: |
          rm -f tools/apply_pr304_document_failure_guard.py .github/workflows/pr304-document-guard.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Guard document failure writes by processing ownership"
          git push origin HEAD:fix/ic072-postmerge-ownership
