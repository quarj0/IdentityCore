name: Apply IC-072 post-merge ownership hotfix

on:
  push:
    branches:
      - fix/ic072-postmerge-ownership
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ic072-postmerge-ownership
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --group django --group dev --frozen
      - name: Apply deterministic ownership patch
        run: python scripts/apply_ic072_postmerge_hotfix.py
      - name: Format changed Python
        run: uv run --project backend black backend/django/apps/verifications/processing_jobs.py backend/django/apps/providers/services.py backend/django/apps/biometrics/tasks.py backend/django/apps/identity_documents/tasks.py
      - name: Lint changed Python
        run: uv run --project backend ruff check backend/django/apps/verifications/processing_jobs.py backend/django/apps/providers/services.py backend/django/apps/biometrics/tasks.py backend/django/apps/identity_documents/tasks.py
      - name: Run focused ownership and recovery tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
        run: uv run --project backend python backend/django/manage.py test apps.providers.test_route_final_action_ownership apps.verifications.test_processing_jobs apps.verifications.test_processing_job_review_races apps.biometrics.test_finalization_recovery apps.identity_documents.tests --verbosity 1
      - name: Verify patch
        run: git diff --check
      - name: Remove one-shot patch machinery and commit source fix
        run: |
          git rm .github/workflows/apply-ic072-hotfix.yml scripts/apply_ic072_postmerge_hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/django/apps/verifications/processing_jobs.py backend/django/apps/providers/services.py backend/django/apps/biometrics/tasks.py backend/django/apps/identity_documents/tasks.py
          git commit -m "Fix post-merge processing ownership races"
          git push origin HEAD:fix/ic072-postmerge-ownership
