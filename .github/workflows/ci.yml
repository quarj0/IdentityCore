name: CI

on:
  push:
  pull_request:

jobs:
  operational-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate SLO rules and synthetic burn scenarios
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/ops/observability:/rules:ro" -w /rules prom/prometheus:v3.15.0 check rules alerts.yaml
          docker run --rm --entrypoint promtool -v "$PWD/ops/observability:/rules:ro" -w /rules prom/prometheus:v3.15.0 test rules alerts.test.yaml

  operational-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --group django --frozen
      - name: Prepare private synthetic credentials
        run: python scripts/prepare_operational_drill.py --directory "$RUNNER_TEMP/identitycore-drill"
      - name: Start isolated PostgreSQL and HTTP S3 fixture
        run: docker compose --env-file "$RUNNER_TEMP/identitycore-drill/drill.env" -p identitycore-drill -f ops/drills/compose.yaml up -d --wait
      - name: Exercise encrypted archive round-trip, restore and tenant isolation
        run: uv run --project backend python scripts/run_restore_drill.py --env-file "$RUNNER_TEMP/identitycore-drill/drill.env" --backup-key-file "$RUNNER_TEMP/identitycore-drill/backup.key" --report "$RUNNER_TEMP/restore-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-restore-evidence
          path: ${{ runner.temp }}/restore-report.json
          retention-days: 90
      - name: Gate the pilot load with concurrent applicants and sustained arrivals
        run: uv run --project backend python scripts/run_operational_load.py --env-file "$RUNNER_TEMP/identitycore-drill/drill.env" --report "$RUNNER_TEMP/load-report.json" --duration-seconds 60 --rate-per-minute 30 --concurrency 20 --burst
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-load-evidence
          path: ${{ runner.temp }}/load-report.json
          retention-days: 90
      - name: Remove only the synthetic stack
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/identitycore-drill/drill.env" -p identitycore-drill -f ops/drills/compose.yaml down -v

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate implementation backlog
        run: python scripts/sync_github_issues.py
      - name: Validate locked evaluation harness
        run: python -m unittest discover -s tools/evaluation -p "test_*.py"
      - name: Validate records-of-processing inventory
        run: |
          python scripts/check_processing_inventory.py
          python -m unittest discover -s scripts -p test_processing_inventory.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run published provider conformance fixtures
        run: python -m unittest discover -s provider-sdk/conformance/tests
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --group django --group dev --frozen
      - name: Run the complete Django backend test suite
        run: DJANGO_SETTINGS_MODULE=config.settings.testing uv run --project backend python backend/django/manage.py test apps common config
      - name: Reject public API and OpenAPI drift
        run: DJANGO_SETTINGS_MODULE=config.settings.testing uv run --project backend python scripts/check_openapi_contract.py
      - name: Reject generated SDK model drift
        run: uv run --project backend python scripts/generate_sdk_models.py --check
      - name: Test built-in adapters against Provider Contract v1
        run: DJANGO_SETTINGS_MODULE=config.settings.testing uv run --project backend python backend/django/manage.py test apps.providers.tests.ProviderAdapterRegistryTests

  backend-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: identitycore_ci
          POSTGRES_USER: identitycore_ci
          POSTGRES_PASSWORD: identitycore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identitycore_ci -d identitycore_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.base
      POSTGRES_DB: identitycore_ci
      POSTGRES_USER: identitycore_ci
      POSTGRES_PASSWORD: identitycore_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --group django --frozen
      - name: Reject model changes without migrations
        run: uv run --project backend python backend/django/manage.py makemigrations --check --dry-run
      - name: Apply migrations to an empty PostgreSQL database
        run: uv run --project backend python backend/django/manage.py migrate --noinput
      - name: Test concurrent idempotency, human decisions and audit chains on PostgreSQL
        run: uv run --project backend python backend/django/manage.py test apps.api_clients.test_usage apps.api_clients.test_idempotency apps.risk.test_decision_races apps.risk.test_external_races apps.providers.test_manifest_races --verbosity 1

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --group ai-service --group dev --frozen
      - name: Normalize OpenCV runtime
        run: uv pip install --python backend/.venv/bin/python --reinstall opencv-contrib-python-headless==4.10.0.84
      - run: uv run --project .. pytest tests
        working-directory: backend/ai-service

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm --recursive lint
        working-directory: frontend
      - run: pnpm --recursive build
        working-directory: frontend
      - run: pnpm --filter @identitycore/api-client test
        working-directory: frontend
      - run: pnpm --filter @identitycore/api-client exec tsc -p tsconfig.json
        working-directory: frontend
      - run: pnpm --filter verification-portal exec playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: pnpm --filter verification-portal test:e2e
        working-directory: frontend
      - name: Run provider setup and promotion browser journey
        run: pnpm --filter verification-portal exec playwright test --config=playwright.dashboard.config.ts
        working-directory: frontend
      - name: Run platform-admin accessibility journeys
        run: pnpm --filter verification-portal exec playwright test --config=playwright.platform-admin.config.ts
        working-directory: frontend
      - run: docker build -f verification-portal/Dockerfile -t identitycore/verification-portal:ci .
        working-directory: frontend

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: python -m unittest discover -s sdk/python/tests
      - run: python -m pip install build && python -m build sdk/python
      - run: npm test
        working-directory: sdk/javascript
      - run: npm pack --dry-run
        working-directory: sdk/javascript

  java-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: sdk/java/pom.xml
      - run: mvn --batch-mode test package
        working-directory: sdk/java

  dotnet-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore IdentityCore.sln
        working-directory: sdk/dotnet
      - run: dotnet test IdentityCore.sln --configuration Release --no-restore
        working-directory: sdk/dotnet
      - run: dotnet pack src/IdentityCore/IdentityCore.csproj --configuration Release --no-restore
        working-directory: sdk/dotnet

  sdk-live-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --group django --frozen
      - run: scripts/start_sdk_compat_backend.sh
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=sdk/python python -m unittest discover -s sdk/python/tests -p 'test_live_compatibility.py'
      - name: Stop compatibility backend
        if: always()
        run: |
          if [ -n "${IDENTITYCORE_COMPAT_SERVER_PID:-}" ]; then
            kill -- "-${IDENTITYCORE_COMPAT_SERVER_PID}" 2>/dev/null || kill "${IDENTITYCORE_COMPAT_SERVER_PID}" 2>/dev/null || true
          fi

  sdk-live-javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --group django --frozen
      - run: scripts/start_sdk_compat_backend.sh
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --test test/live-compatibility.test.js
        working-directory: sdk/javascript
      - name: Stop compatibility backend
        if: always()
        run: |
          if [ -n "${IDENTITYCORE_COMPAT_SERVER_PID:-}" ]; then
            kill -- "-${IDENTITYCORE_COMPAT_SERVER_PID}" 2>/dev/null || kill "${IDENTITYCORE_COMPAT_SERVER_PID}" 2>/dev/null || true
          fi

  sdk-live-java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --group django --frozen
      - run: scripts/start_sdk_compat_backend.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - run: mvn --batch-mode -Dtest=LiveCompatibilityTest test
        working-directory: sdk/java
      - name: Stop compatibility backend
        if: always()
        run: |
          if [ -n "${IDENTITYCORE_COMPAT_SERVER_PID:-}" ]; then
            kill -- "-${IDENTITYCORE_COMPAT_SERVER_PID}" 2>/dev/null || kill "${IDENTITYCORE_COMPAT_SERVER_PID}" 2>/dev/null || true
          fi

  sdk-live-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --group django --frozen
      - run: scripts/start_sdk_compat_backend.sh
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test IdentityCore.sln --configuration Release --filter FullyQualifiedName~LiveCompatibilityTests
        working-directory: sdk/dotnet
      - name: Stop compatibility backend
        if: always()
        run: |
          if [ -n "${IDENTITYCORE_COMPAT_SERVER_PID:-}" ]; then
            kill -- "-${IDENTITYCORE_COMPAT_SERVER_PID}" 2>/dev/null || kill "${IDENTITYCORE_COMPAT_SERVER_PID}" 2>/dev/null || true
          fi
