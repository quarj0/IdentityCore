name: PR304 one-shot review patch

on:
  push:
    branches:
      - fix/ic072-postmerge-ownership
    paths:
      - tools/apply_pr304_review_fixes.py
      - .github/workflows/pr304-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ic072-postmerge-ownership
          fetch-depth: 0
      - name: Apply exact review fixes
        run: python tools/apply_pr304_review_fixes.py
      - name: Verify syntax and patch hygiene
        run: |
          python -m py_compile \
            backend/django/apps/verifications/processing_jobs.py \
            backend/django/apps/biometrics/tasks.py
          git diff --check
      - name: Remove one-shot machinery and commit source fix
        run: |
          rm -f tools/apply_pr304_review_fixes.py .github/workflows/pr304-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix stale failure evidence and biometric recovery links"
          git push origin HEAD:fix/ic072-postmerge-ownership
