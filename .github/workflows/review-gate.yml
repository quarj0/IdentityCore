name: Review evidence gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/security.yml'
      - '.github/workflows/review-gate.yml'
      - '.github/workflows/review-evidence-signal.yml'
      - '.github/scripts/review-gate.cjs'
      - '.github/scripts/merge-reviewed-pr.cjs'
      - '.github/review-gate-policy.json'
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [CI, Security, Review evidence signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to recheck after resolving threads
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  discover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'issue_comment' || (github.event.issue.pull_request && (github.event.comment.user.login == 'chatgpt-codex-connector' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]')))
    runs-on: ubuntu-latest
    environment: review-evidence-publisher
    outputs:
      targets: ${{ steps.prepare.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create isolated check publisher token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: publisher
        with:
          client-id: ${{ vars.REVIEW_GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_GATE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: write
      - uses: actions/github-script@v8
        id: prepare
        with:
          github-token: ${{ steps.publisher.outputs.token }}
          script: |
            if (!require('node:fs').existsSync('./.github/scripts/review-gate.cjs')) {
              core.notice('Review gate bootstrap: validator is not yet installed on the default branch.');
              core.setOutput('targets', '[]');
              return;
            }
            const { preparePullRequests, bucketTargets } = require('./.github/scripts/review-gate.cjs');
            const targets = await preparePullRequests({ github, context });
            core.setOutput('targets', JSON.stringify(bucketTargets(targets)));
  review-evidence:
    needs: discover
    if: needs.discover.outputs.targets != '[]' && needs.discover.outputs.targets != ''
    strategy:
      fail-fast: false
      matrix:
        bucket: ${{ fromJSON(needs.discover.outputs.targets) }}
    # Every event, including default-branch bulk revalidation, shares this lock.
    concurrency:
      group: review-evidence-bucket-${{ matrix.bucket }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: review-evidence-publisher
    steps:
      # Never execute PR-controlled source with the write-capable check token.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create isolated check publisher token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: publisher
        with:
          client-id: ${{ vars.REVIEW_GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_GATE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: write
      - uses: actions/github-script@v8
        env:
          REVIEW_BUCKET: ${{ matrix.bucket }}
          REVIEW_GATE_RESOLVER_LOGIN: ${{ vars.REVIEW_GATE_RESOLVER_LOGIN }}
          REVIEW_GATE_APPROVED_UPDATES: ${{ vars.REVIEW_GATE_APPROVED_UPDATES }}
        with:
          github-token: ${{ steps.publisher.outputs.token }}
          script: |
            const bucket = Number(process.env.REVIEW_BUCKET);
            const { runBucket } = require('./.github/scripts/review-gate.cjs');
            await runBucket({ github, context, bucket });
