name: Review evidence gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to recheck after resolving threads
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write
jobs:
  review-evidence:
    if: (github.event_name != 'issue_comment' || github.event.issue.pull_request) && (github.event_name != 'workflow_run' || github.event.workflow_run.pull_requests[0])
    runs-on: ubuntu-latest
    steps:
      # Never execute PR-controlled source with the write-capable check token.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const { run } = require('./.github/scripts/review-gate.cjs');
            await run({ github, context });
