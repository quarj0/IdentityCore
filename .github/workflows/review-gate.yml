name: Review publisher isolation probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment-denial:
    runs-on: ubuntu-latest
    environment: review-evidence-publisher
    steps:
      - run: echo 'This feature branch must be denied by deployment policy.'
  actions-check:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.checks.create({ ...context.repo, name: 'review-evidence', head_sha: context.sha, status: 'completed', conclusion: 'success', output: { title: 'Intentional untrusted publisher probe', summary: 'Verifies a GitHub Actions check cannot satisfy the dedicated App requirement.' } });
