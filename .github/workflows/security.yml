name: Security

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  pr-target-proof:
    name: Security target proof
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record immutable PR target
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PYTHON'
          import json, os
          if os.environ["PR_NUMBER"]:
              print("IDENTITYCORE_PR_TARGET " + json.dumps({
                  "number": int(os.environ["PR_NUMBER"]), "head": os.environ["PR_HEAD"],
                  "base": os.environ["PR_BASE"], "head_repo": os.environ["PR_REPO"],
                  "head_branch": os.environ["PR_BRANCH"], "run_id": int(os.environ["RUN_ID"]),
                  "run_attempt": int(os.environ["RUN_ATTEMPT"])}))
          PYTHON

  repository-scan:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create results directory
        run: mkdir -p security-results

      - name: Record dependency findings
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: security-results/dependencies.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0

      - name: Record secret findings
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: json
          output: security-results/secrets.json
          exit-code: 0

      - name: Upload repository scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-security-findings
          path: security-results
          if-no-files-found: error
          retention-days: 30

      - name: Block high and critical dependency findings
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Block detected secrets
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: 1

  container-scan:
    name: Container - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: django
            context: .
            dockerfile: backend/django/Dockerfile
          - name: managed-ai
            context: .
            dockerfile: backend/ai-service/Dockerfile
          - name: verification-portal
            context: frontend
            dockerfile: frontend/verification-portal/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "identitycore/${{ matrix.name }}:security" "${{ matrix.context }}"

      - name: Create results directory
        run: mkdir -p security-results

      - name: Record container findings
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: identitycore/${{ matrix.name }}:security
          format: json
          output: security-results/${{ matrix.name }}.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0

      - name: Upload container scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-${{ matrix.name }}
          path: security-results/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Block high and critical container findings
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: identitycore/${{ matrix.name }}:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  required-security:
    name: Security required
    if: ${{ always() }}
    needs: [pr-target-proof, repository-scan, container-scan]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every workflow job to succeed
        env:
          WORKFLOW_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ["WORKFLOW_RESULTS"])
          blocked = [name for name, result in results.items() if result.get("result") != "success"]
          if not results or blocked:
              raise SystemExit("Required jobs did not succeed: " + ", ".join(blocked))
          print("Every required workflow job succeeded.")
          PY
