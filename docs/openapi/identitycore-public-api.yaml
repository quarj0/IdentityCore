  /webhook-endpoints/{webhook_id}/rotate:
    post:
      summary: Rotate a webhook endpoint signing secret with a bounded overlap.
      security:
        - platformUserBearer: []
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: New signing secret returned once with the previous-secret overlap expiry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    allOf:
                      - $ref: "#/components/schemas/WebhookEndpointSummary"
                      - type: object
                        required: [secret]
                        properties:
                          secret:
                            type: string
                  request_id:
                    type: string
