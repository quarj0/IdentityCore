openapi: 3.1.0
info:
  title: IdentityCore Public API
  version: 0.4.0
  description: Public REST API surface plus workspace-authenticated portal routes used by IdentityCore SDKs and sandbox testing.
servers:
  - url: https://api.identitycore.com/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local development
security:
  - apiClient: []
    apiClientId: []
components:
  securitySchemes:
    apiClient:
      type: http
      scheme: bearer
      bearerFormat: API client secret
      description: Send the API client secret as a bearer token and the client ID in `X-Client-Id`.
    apiClientId:
      type: apiKey
      in: header
      name: X-Client-Id
      description: Send the API client ID with the bearer API client secret.
    platformUserBearer:
      type: http
      scheme: bearer
      description: Portal JWT authentication used by authenticated workspace users.
    platformRefreshCookie:
      type: apiKey
      in: cookie
      name: identitycore_refresh
      description: Scoped HttpOnly refresh token cookie issued by platform-user login.
    verificationSessionBearer:
      type: http
      scheme: bearer
      bearerFormat: Verification session token
      description: Short-lived subject session token issued with a hosted verification link.
    verificationSessionId:
      type: apiKey
      in: header
      name: X-Session-Id
      description: Verification session identifier required when it is not present in the URL path.
    providerSignature:
      type: apiKey
      in: header
      name: X-IC-Signature
      description: ic-provider-v1 exact-wire HMAC signature; also requires X-IC-Key-Id, X-IC-Timestamp, X-IC-Nonce and X-IC-Signature-Version. Shared replay state must be available.
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: A caller-generated key retained for 24 hours. Reusing it with the same payload replays the original result.
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [success, error, request_id]
      properties:
        success:
          const: false
        error:
          $ref: "#/components/schemas/Error"
        request_id:
          type: string
    WorkflowSummary:
      type: object
      required: [id, project_id, name, status, steps, settings, current_version]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        steps:
          type: array
          items:
            type: string
        settings:
          type: object
          additionalProperties: true
        current_version:
          type: integer
        source_template_id:
          type: [string, "null"]
        source_template_version:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Policy:
      type: object
      required:
        - id
        - name
        - version
        - status
        - required_document_types
        - required_liveness_level
        - face_match_threshold
        - manual_review_threshold
        - maker_checker_required
        - verification_expiry_minutes
        - media_retention_days
        - metadata_retention_days
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: pol_01JABC
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, active, archived]
        required_document_types:
          type: array
          items:
            type: string
            enum: [national_id, passport, driver_license, health_id, voter_id]
        required_liveness_level:
          type: string
          enum: [passive, active]
        face_match_threshold:
          type: number
        manual_review_threshold:
          type: number
        review_reason_rules:
          type: object
          description: Version 1 outcome-specific reviewer codes, required notes and organization-facing allowlist; see manual review reasons guide.
          additionalProperties: true
        reuse_rules:
          type: object
          description: Version 1 duplicate and velocity scope, retention, window, thresholds and flag/manual_review action; empty disables matching.
          additionalProperties: true
        document_consistency_rules:
          type: object
          additionalProperties: true
          default: {}
          description: Version 1 country-specific document consistency rules and actions; see the document consistency operations guide.
        document_authenticity_required:
          type: boolean
          default: false
        document_authenticity_min_confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.9
        external_risk_enabled:
          type: boolean
          default: false
          description: Collect external risk evidence using the configured environment route.
        external_risk_failure_action:
          type: string
          enum: [manual_review, ignore]
          default: manual_review
        external_risk_review_threshold:
          type: number
          minimum: 0
          maximum: 100
          default: 70
          description: Scores at or above this threshold require review; external evidence never directly approves.
        maker_checker_required:
          type: boolean
          description: Require an independent checker for every manual decision.
        verification_expiry_minutes:
          type: integer
        media_retention_days:
          type: integer
        metadata_retention_days:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VerificationSubjectInput:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
        date_of_birth:
          type: string
          format: date
        metadata:
          type: object
          additionalProperties: true
    VerificationCreateRequest:
      type: object
      required: [purpose, policy_id, verification_subject]
      properties:
        external_reference:
          type: string
        purpose:
          type: string
        policy_id:
          type: string
          description: Active verification policy/template ID. Required for API-client requests.
        project_id:
          type: string
          description: Project environment identifier. Defaults to the tenant's sandbox project for backward compatibility.
        verification_subject:
          $ref: "#/components/schemas/VerificationSubjectInput"
        redirect_url:
          type: string
          format: uri
        metadata:
          type: object
          additionalProperties: true
    PlatformUserLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    PlatformUser:
      type: object
      required:
        [
          public_id,
          email,
          first_name,
          last_name,
          phone_number,
          status,
          tenant_public_id,
          tenant_name,
          tenant_status,
          is_platform_admin,
          mfa_enabled,
          roles,
          notification_preferences,
          last_login_at,
          created_at,
          updated_at,
        ]
      properties:
        public_id:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        status:
          type: string
        tenant_public_id:
          type: [string, "null"]
        tenant_name:
          type: [string, "null"]
        tenant_status:
          type: [string, "null"]
        is_platform_admin:
          type: boolean
        mfa_enabled:
          type: boolean
        roles:
          type: array
          items:
            type: string
        notification_preferences:
          type: object
          additionalProperties: true
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlatformUserMfaChallenge:
      type: object
      required: [mfa_required, mfa_enrollment_required, mfa_token]
      properties:
        mfa_required:
          type: boolean
          const: true
        mfa_enrollment_required:
          type: boolean
        mfa_token:
          type: string
    PlatformUserAuthentication:
      type: object
      required: [tokens, user]
      properties:
        tokens:
          type: object
          required: [access]
          properties:
            access:
              type: string
        user:
          $ref: "#/components/schemas/PlatformUser"
        recovery_codes:
          type: array
          description: One-time recovery codes returned only after MFA enrollment confirmation.
          items:
            type: string
    PlatformUserMfaEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [mfa_token]
      properties:
        mfa_token:
          type: string
          description: Short-lived enrollment token returned by platform-user login.
    PlatformUserMfaCodeRequest:
      type: object
      additionalProperties: false
      required: [mfa_token, code]
      properties:
        mfa_token:
          type: string
          description: Short-lived MFA transaction token returned by platform-user login.
        code:
          type: string
          description: Six-digit authenticator code, or a recovery code for an MFA challenge.
    PlatformUserMfaEnrollment:
      type: object
      required: [secret, provisioning_uri]
      properties:
        secret:
          type: string
          description: Base32 TOTP secret to store in the user's authenticator.
        provisioning_uri:
          type: string
          format: uri
    VerificationPolicyCreateRequest:
      type: object
      additionalProperties: false
      description: The manual_review_threshold must be less than or equal to face_match_threshold.
      required:
        [
          name,
          required_document_types,
          required_liveness_level,
          face_match_threshold,
          manual_review_threshold,
          verification_expiry_minutes,
          media_retention_days,
          metadata_retention_days,
        ]
      properties:
        project_id:
          type: string
        name:
          type: string
          maxLength: 255
        description:
          type: string
        consent_template_id:
          type: string
        default_locale:
          type: string
          maxLength: 16
          default: en
        supported_locales:
          type: array
          items:
            type: string
            maxLength: 16
        required_document_types:
          type: array
          minItems: 1
          items:
            type: string
            enum: [national_id, passport, driver_license, health_id, voter_id]
        required_liveness_level:
          type: string
          enum: [passive, active]
        face_match_threshold:
          type: number
          minimum: 0
          maximum: 1
        manual_review_threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Must be less than or equal to face_match_threshold.
        review_reason_rules:
          type: object
          description: Version 1 outcome-specific reviewer codes, required notes and organization-facing allowlist; see manual review reasons guide.
          additionalProperties: true
        reuse_rules:
          type: object
          description: Version 1 duplicate and velocity scope, retention, window, thresholds and flag/manual_review action; empty disables matching.
          additionalProperties: true
        document_consistency_rules:
          type: object
          additionalProperties: true
          default: {}
          description: Version 1 country-specific document consistency rules and actions; see the document consistency operations guide.
        document_authenticity_required:
          type: boolean
          default: false
        document_authenticity_min_confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.9
        external_risk_enabled:
          type: boolean
          default: false
          description: Collect external risk evidence using the configured environment route.
        external_risk_failure_action:
          type: string
          enum: [manual_review, ignore]
          default: manual_review
        external_risk_review_threshold:
          type: number
          minimum: 0
          maximum: 100
          default: 70
          description: Scores at or above this threshold require review; external evidence never directly approves.
        maker_checker_required:
          type: boolean
          default: false
        verification_expiry_minutes:
          type: integer
          minimum: 1
        media_retention_days:
          type: integer
          minimum: 1
        metadata_retention_days:
          type: integer
          minimum: 1
    VerificationPolicyCreateResponse:
      type: object
      required: [id, name, version, status]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: integer
        status:
          type: string
          const: draft
    VerificationCreateResponse:
      type: object
      required: [id, status, verification_url, session_id, expires_at]
      properties:
        id:
          type: string
        status:
          type: string
        verification_url:
          type: string
          format: uri
        session_id:
          type: string
        session_token:
          type: string
          description: Raw session token returned only when issuing a fresh hosted link.
        expires_at:
          type: string
          format: date-time
    VerificationSessionConsentRequest:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
        template_id:
          type: string
          maxLength: 64
        version:
          type: integer
          minimum: 1
        locale:
          type: string
          maxLength: 16
        content_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
    VerificationSessionDocumentRequest:
      type: object
      additionalProperties: false
      required: [document_type, country_code, captures]
      example:
        document_type: passport
        country_code: GH
        captures:
          - side: single
            upload_id: upl_01JABC
      properties:
        document_type:
          type: string
          maxLength: 64
        country_code:
          type: string
          maxLength: 8
        captures:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [side, upload_id]
            properties:
              side:
                type: string
                enum: [front, back, single, mrz, other]
              upload_id:
                type: string
                maxLength: 64
    VerificationSessionSelfieRequest:
      type: object
      additionalProperties: false
      required: [capture_type, upload_id]
      properties:
        capture_type:
          type: string
          enum: [image, video]
        upload_id:
          type: string
          maxLength: 64
    VerificationSessionLivenessRequest:
      type: object
      additionalProperties: false
      required: [liveness_type, selfie_capture_id]
      if:
        properties:
          liveness_type:
            const: active
        required: [liveness_type]
      then:
        required: [challenge_id]
      properties:
        liveness_type:
          type: string
          enum: [passive, active]
        selfie_capture_id:
          type: string
          maxLength: 64
        challenge_id:
          type: string
          maxLength: 64
    VerificationMobileHandoffRedeemResponse:
      type: object
      required: [session_id, session_token, verification_id]
      properties:
        session_id:
          type: string
        session_token:
          type: string
        verification_id:
          type: string
    VerificationSessionResponse:
      type: object
      required:
        [
          session_id,
          verification_id,
          status,
          organization,
          purpose,
          redirect_url,
          required_steps,
          workflow,
          locale,
          supported_locales,
          direction,
          consent,
          document,
          available_documents,
          available_countries,
          expires_at,
        ]
      properties:
        session_id:
          type: string
        verification_id:
          type: string
        status:
          type: string
        organization:
          type: object
          additionalProperties: true
        purpose:
          type: string
        redirect_url:
          type: string
        required_steps:
          type: array
          items:
            type: string
        workflow:
          type: object
          additionalProperties: true
        locale:
          type: string
        supported_locales:
          type: array
          items:
            type: string
        direction:
          type: string
          enum: [ltr, rtl]
        consent:
          type: object
          additionalProperties: true
        document:
          type: object
          additionalProperties: true
        available_documents:
          type: array
          items:
            type: object
            additionalProperties: true
        available_countries:
          type: array
          items:
            type: object
            additionalProperties: true
        expires_at:
          type: string
          format: date-time
    VerificationSessionConsentResponse:
      type: object
      required: [consent_record_id, next_step]
      properties:
        consent_record_id:
          type: string
        next_step:
          type: string
          const: document_capture
    VerificationSessionDocumentResponse:
      type: object
      required: [identity_document_id, status, next_step]
      properties:
        identity_document_id:
          type: string
        status:
          type: string
        next_step:
          type: string
          const: document_processing
    VerificationSessionSelfieResponse:
      type: object
      required: [selfie_capture_id, status, next_step]
      properties:
        selfie_capture_id:
          type: string
        status:
          type: string
          const: processing
        next_step:
          type: string
          const: liveness_check
    VerificationSessionLivenessResponse:
      type: object
      required: [liveness_check_id, status]
      properties:
        liveness_check_id:
          type: string
        status:
          type: string
          const: processing
    VerificationSessionLivenessChallengeResponse:
      type: object
      required: [challenge_id, actions, expires_at, expires_in]
      properties:
        challenge_id:
          type: string
        actions:
          type: array
          items:
            type: string
            enum: [turn_left, turn_right, look_up, look_down]
        expires_at:
          type: string
          format: date-time
        expires_in:
          type: integer
          minimum: 0
          description: Remaining server lifetime in seconds; clients should count down with a monotonic clock.
    VerificationSessionStatusResponse:
      type: object
      required: [verification_id, status, current_step, message, evidence]
      properties:
        verification_id:
          type: string
        status:
          type: string
        current_step:
          type: string
        message:
          type: string
        withdrawal_available:
          type: boolean
          description: Whether a recorded acceptance can be withdrawn, independent of proof decryption availability.
        evidence:
          type: object
          additionalProperties: false
          required: [identity_document_id, selfie_capture_id, liveness_check_id]
          properties:
            identity_document_id:
              type: string
            selfie_capture_id:
              type: string
            liveness_check_id:
              type: string
    VerificationMobileHandoffResponse:
      type: object
      required: [handoff_url, expires_at]
      properties:
        handoff_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    VerificationSummary:
      type: object
      required:
        [id, status, purpose, external_reference, subject, policy, created_at]
      properties:
        id:
          type: string
        status:
          type: string
        purpose:
          type: string
        external_reference:
          type: string
        subject:
          type: object
          properties:
            id:
              type: string
            full_name:
              type: string
            email:
              type: string
        policy:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            version:
              type: integer
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
    VerificationDetail:
      type: object
      required:
        [
          id,
          status,
          purpose,
          policy,
          workflow,
          external_reference,
          verification_subject,
          checks,
          risk_assessment,
          document_classification,
          evidence_report,
          decision,
          created_at,
          completed_at,
          expires_at,
        ]
      properties:
        id:
          type: string
        status:
          type: string
        purpose:
          type: string
        policy:
          type: object
          additionalProperties: true
        workflow:
          type: object
          additionalProperties: true
        external_reference:
          type: string
        verification_subject:
          type: object
          required: [id, full_name]
          properties:
            id:
              type: string
            full_name:
              type: string
        checks:
          type: object
          additionalProperties: true
        risk_assessment:
          type: [object, "null"]
          additionalProperties: true
        document_classification:
          type: [object, "null"]
          additionalProperties: true
        evidence_report:
          type: [object, "null"]
          additionalProperties: true
        decision:
          type: [object, "null"]
          additionalProperties: true
          properties:
            can_approve:
              type: boolean
              description: Current authenticated review eligibility hint; false for makers, creators, subject identities and callers without review access. Approval revalidates under lock.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: string
          format: date-time
    SandboxSimulationRequest:
      type: object
      required: [scenario]
      properties:
        scenario:
          type: string
          enum: [approved, declined, review, timeout, provider_error]
    SandboxSimulationMarker:
      type: object
      additionalProperties: false
      required: [scenario, version]
      properties:
        scenario:
          type: string
          enum: [approved, declined, review, timeout, provider_error]
        version:
          type: integer
          const: 1
    VerificationResult:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - verification_id
        - status
        - decision
        - policy
        - workflow
        - check_provenance
        - timestamps
      properties:
        simulation:
          $ref: "#/components/schemas/SandboxSimulationMarker"
        schema_version:
          type: string
          const: "1"
        verification_id:
          type: string
        status:
          type: string
        decision:
          type: [object, "null"]
          additionalProperties: false
          required:
            - outcome
            - type
            - reason_codes
            - approval_status
            - contract_version
            - decided_at
          properties:
            outcome:
              type: string
            type:
              type: string
            reason_codes:
              type: array
              items:
                type: string
            approval_status:
              type: string
            contract_version:
              type: string
            decided_at:
              type: string
              format: date-time
        policy:
          type: object
          additionalProperties: false
          required: [policy_id, version]
          properties:
            policy_id:
              type: [string, "null"]
            version:
              type: [integer, "null"]
        workflow:
          type: object
          additionalProperties: false
          required: [workflow_id, version_id, version]
          properties:
            workflow_id:
              type: [string, "null"]
            version_id:
              type: [string, "null"]
            version:
              type: [integer, "null"]
        check_provenance:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - check_id
              - capability
              - status
              - provider
              - capability_contract_version
              - evidence
              - error_code
              - started_at
              - completed_at
              - duration_ms
            properties:
              check_id:
                type: string
              capability:
                type: string
              status:
                type: string
              provider:
                type: object
                additionalProperties: false
                required: [provider_id, code, type]
                properties:
                  provider_id:
                    type: string
                  code:
                    type: string
                  type:
                    type: string
              capability_contract_version:
                type: [string, "null"]
              evidence:
                type: object
                additionalProperties: false
                properties:
                  confidence_level:
                    type: string
                  confidence_score:
                    type: number
                  score:
                    type: number
                  match_score:
                    type: number
                  quality_score:
                    type: number
                  threshold_used:
                    type: number
                  model:
                    type: object
                    additionalProperties: false
                    required: [name, version]
                    properties:
                      name:
                        type: string
                      version:
                        type: string
                  issues:
                    type: array
                    items:
                      type: string
              error_code:
                type: [string, "null"]
              started_at:
                type: string
                format: date-time
              completed_at:
                type: [string, "null"]
                format: date-time
              duration_ms:
                type: [integer, "null"]
        timestamps:
          type: object
          additionalProperties: false
          required: [created_at, updated_at, completed_at, expires_at]
          properties:
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            completed_at:
              type: [string, "null"]
              format: date-time
            expires_at:
              type: string
              format: date-time
    CursorPagination:
      type: object
      description: Cursor pagination metadata. Cursors are opaque and must be reused with the same filters.
      required: [limit, next_cursor, has_more]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    PagePagination:
      type: object
