          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/PermissionDenied"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The previous-secret overlap is still active, or the idempotency key conflicts with an earlier request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
