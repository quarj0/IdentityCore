packages:
  - "*"
  - "packages/*"
allowBuilds:
  # Scarf is optional telemetry and core-js-pure has no required native build.
  '@scarf/scarf': false
  core-js-pure: false
  # Swagger's optional YAML/JSON parsers use these native grammars.
  '@tree-sitter-grammars/tree-sitter-yaml': true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true

overrides:
  brace-expansion@1: 1.1.18
  brace-expansion@5: 5.0.9
  dompurify: 3.4.13
  js-yaml: 4.3.1
  nanoid: 3.3.17
  postcss: 8.5.23
  sharp: 0.35.0
