packages:
  - "*"
  - "packages/*"
allowBuilds:
  # Scarf is optional telemetry and core-js-pure has no required native build.
  '@scarf/scarf': false
  core-js-pure: false
  # Swagger's optional YAML/JSON parsers use these native grammars.
  '@tree-sitter-grammars/tree-sitter-yaml': true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true

overrides:
  axios: 1.20.0
  baseline-browser-mapping: 2.11.21
  brace-expansion@1: 1.1.20
  brace-expansion@5: 5.0.11
  dompurify: 3.4.13
  browserslist: 4.28.7
  js-yaml: 4.3.2
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.4
